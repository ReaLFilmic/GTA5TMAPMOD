; TmapVoice 설정 파일  (; 로 시작하는 줄은 설명)

[Settings]
; 쓸 음성 폴더: tmap_plain = 효과음(딩동) 없는 버전 / tmap_chime = 효과음 있는 버전
Voice=tmap_plain

; 몇 m 남았을 때 미리 안내할지 (prepare_*)
PrepareDistance=250
; 몇 m 남았을 때 "지금 회전" 안내를 할지 (turn_*)
TurnDistance=70
; 목적지에서 몇 m 안이면 도착으로 볼지
ArriveDistance=40

; GTA가 주는 거리 값을 미터로 바꾸는 배율. 기본 1.
; (일부 자료에서 '미터의 10배'라고 해서, 화면의 dist 숫자가 실제 거리의 10배로 보이면 0.1로 바꾸세요.)
DistScale=1

; 1이면 로그에 매 순간의 원본 값/위치/방향을 기록 (보정용. 평소엔 0으로 끄세요)
Trace=1

; 1이면 화면 아래 자막으로 dir / dist 값을 보여줌 (보정할 때 필요)
Debug=0
; F9 = 소리 테스트, F10 = 디버그 자막 켜기/끄기, F8 = 지금 읽은 경로 점/각도를 로그에 덤프
TestKey=F9
DebugKey=F10
DumpKey=F8

[Codes]
; GTA가 돌려주는 direction 번호가 어떤 안내인지 적는 곳. -1 = 사용 안 함.
; 아래 기본값은 커뮤니티 문서(RAGE:MP 위키)에 적힌 표를 따른 것입니다.
;   0 도착 / 1 경로 재탐색(유턴) / 2 경로 따라가기 / 3 왼쪽 유지(미확인) / 4 좌회전
;   5 우회전 / 6 오른쪽 유지(미확인) / 7 직진 / 8 고속도로 진입 / 9 고속도로 출구
Straight=7
Left=4
Right=5
; 3, 6은 문서에서도 확실하지 않아 꺼 둠. 확인되면 3 / 6 으로 바꾸세요.
KeepLeft=-1
KeepRight=-1
UTurn=-1
Recalc=1

[Route]
; 1이면 경로 위 점을 직접 읽어 '꺾임 각도'로 좌/우/유턴을 판정 (dir 번호는 참고용).
; 0이면 예전처럼 dir 번호만 사용. 경로를 못 읽는 환경이면 자동으로 dir 방식으로 넘어감.
UseRoute=1

; 경로 위 점을 몇 m 간격으로, 앞으로 몇 m까지 읽을지 (PrepareDistance+60 보다 작으면 자동 보정)
RouteStep=12
RouteLookahead=320

; 꺾임 각도를 잴 때 앞뒤로 보는 거리(m). 크게 하면 완만한 커브를 덜 꺾임으로 봄.
CornerWindow=30

; 각도 기준(도). 이 값 이상이면 꺾임 '후보'.
MinTurnAngle=35
; 이 값 이상이면 dir 번호와 상관없이 확정. 후보~이 값 사이(애매한 각도)는 dir 도 같은 방향일 때만 확정.
StrongTurnAngle=60
; 이 값 이상이면 유턴 안내
UTurnAngle=150

; 내 앞 이 거리(m) 안의 꺾임은 이미 도는 중으로 보고 무시
MinAheadDist=25

; GET_POS_ALONG_GPS_TYPE_ROUTE 의 2번째/4번째 인자. -1 = 게임 시작 때 자동으로 맞는 조합을 찾음.
; (로그의 'route probe' 줄에서 OK 가 나온 조합을 확인할 수 있음. 자동이 이상하면 직접 지정)
RouteFlag1=-1
RouteFlag3=-1

; 거리 인자 배율. 로그의 a-e 값이 140 근처가 아니면 조정. 기본 1.
RouteScale=1

; Hash 이름으로 함수를 못 찾았다는 로그가 뜰 때만 0x... 해시를 직접 적음. 평소엔 비워 둠.
RouteHash=
